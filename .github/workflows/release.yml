name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: read
  pages: write
  id-token: write

jobs:
  resolve-image:
    uses: ./.github/workflows/resolve-ci-image.yml

  build-wheels:
    name: Build Wheels
    needs: resolve-image
    permissions:
      contents: read
      packages: read
    runs-on: linux-amd64-cpu4
    container:
      image: ${{ needs.resolve-image.outputs.ci_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Build wheels
        run: ci/scripts/python-build-wheels-gh.sh

      - name: Validate rebuilt distributions
        run: python3 ci/scripts/check_wheel_metadata.py artifacts/dist --release-version "${GITHUB_REF_NAME#nv-dfm-v}"

      - name: Test rebuilt wheels in an isolated environment
        shell: bash
        run: |
          set -euo pipefail
          runtime="$(mktemp -d)"
          trap 'rm -rf "$runtime"' EXIT
          uv --no-config venv --python 3.12 "$runtime/environment"
          uv --no-config pip install --python "$runtime/environment/bin/python" artifacts/dist/*.whl
          uv --no-config pip check --python "$runtime/environment/bin/python"
          "$runtime/environment/bin/dfm" --help
          EXPECTED_VERSION="${GITHUB_REF_NAME#nv-dfm-v}" "$runtime/environment/bin/python" -I - <<'PY'
          import importlib
          import importlib.metadata
          import os
          import pathlib
          import sys

          for name in ("nv-dfm-core", "nv-dfm-lib-common", "nv-dfm-lib-weather"):
              assert importlib.metadata.version(name) == os.environ["EXPECTED_VERSION"], name
              module = importlib.import_module(name.replace("-", "_"))
              assert pathlib.Path(module.__file__).resolve().is_relative_to(pathlib.Path(sys.prefix).resolve()), name
          from nv_dfm_lib_weather.load_data import LoadGfsEra5Data
          PY

      - name: Record release package hashes
        working-directory: artifacts/dist
        run: sha256sum *.whl *.tar.gz > SHA256SUMS

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: artifacts/dist/

  build-docs:
    name: Build Docs
    needs: resolve-image
    runs-on: linux-amd64-cpu4
    container:
      image: ${{ needs.resolve-image.outputs.ci_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Parse version from tag
        id: version
        run: echo "number=${GITHUB_REF_NAME#nv-dfm-v}" >> "$GITHUB_OUTPUT"

      - name: Build documentation
        run: ci/scripts/python-build-docs-gh.sh
        env:
          DOC_VERSION: ${{ steps.version.outputs.number }}

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/docs/

  upload-release-assets:
    name: Upload Release Assets
    needs: build-wheels
    runs-on: linux-amd64-cpu4
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist/

      - name: Attach wheels to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --repo "${{ github.repository }}"

  deploy-docs:
    name: Deploy Docs
    needs: build-docs
    runs-on: linux-amd64-cpu4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
