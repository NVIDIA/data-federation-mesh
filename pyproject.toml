[project]
name = "nv-dfm-workspace"
version = "0.0.0"  # Virtual workspace - actual version comes from nv-dfm-core via git tags
description = "Data Federation Mesh Workspace"
authors = [{ name = "NVIDIA" }]
readme = "README.md"
requires-python = ">=3.10,<3.13"
# No dependencies at workspace level - install individual packages as needed
dependencies = [
]

[project.optional-dependencies]
tutorials = [
    "nv-dfm-lib-weather",
    "ipywidgets",
    "leafmap",
]

[tool.uv]
managed = true
index-strategy = "unsafe-best-match"
# Build earth2grid against the project's *installed* (cu129-pinned) torch instead
# of a fresh one from an isolated PEP 517 build 
no-build-isolation-package = ["earth2grid", "torch-harmonics"]
# Pin torch-harmonics to the latest sdist line (0.8.x) and build it from source
# (see no-build-isolation above). 
override-dependencies = ["torch-harmonics>=0.8.0,<0.9.0"]

constraint-dependencies = [
    "warp-lang<1.15",
    "grpcio>=1.83.0rc1",
    "cryptography>=46.0.7,<47",
    "aiohttp>=3.14.4,<4",
    "pygments>=2.20.0",
    "gdown>=5.2.2,<6",
    # onnx (via physicsnemo): CVE fix. 1.22.0 GA is now available, so we floor
    # at the stable release (no pre-release opt-in needed).
    "onnx>=1.22.0",
    # pyarrow (via xarray -> dask): no short-term fix; 25.0.0 is the only
    # patched line (major jump from 20.0.0).
    "pyarrow>=25.0.0",
    # pyasn1 (via gcsfs -> google-auth -> pyasn1-modules): CVE fixes in the 0.6.5
    # patch. Floor it here rather than touching the gcsfs chain that pulls it in.
    "pyasn1>=0.6.5",
    # torch (via physicsnemo/earth2studio): critical CVE, fix in 2.13.0. Not on
    # cu128 (caps at 2.11.0), so we source the CUDA-12.9 build from cu129 below.
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "oauthlib>=4.0.0",
    "msgpack>=1.2.3",
    "hydra-core>=1.3.7",
    "urllib3>=2.8.0",
    "pyjwt>=2.14.0",
    "anyio>=4.14.2",
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.workspace]
members = ["packages/*",
           "tutorials/example-fed/"  
]

[tool.uv.sources]
nv-dfm-core = { workspace = true }
# torch stack: on Linux, source the CUDA-12.9 build from cu129 (has torch 2.13.0;
# cu128 caps at 2.11.0). On macOS dev, fall back to PyPI (CPU/MPS). The marker is
# essential: without it the universal lock can't satisfy macOS from cu129 and
# silently falls back to PyPI (cu13x) for every platform.
torch = [{ index = "pytorch-cu129", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu129", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu129", marker = "sys_platform == 'linux'" }]
nv-dfm-lib-common = { workspace = true }
nv-dfm-lib-weather = { workspace = true }
examplefed = { workspace = true }
earth2studio = { git = "https://github.com/NVIDIA/earth2studio.git", tag = "0.16.0" }

[[tool.uv.dependency-metadata]]
name = "earth2grid"
version = "2025.11.1+torch213"
requires-dist = ["einops", "numpy", "scipy", "torch"]

[[tool.uv.dependency-metadata]]
name = "torch-harmonics"
requires-dist = ["numpy", "torch"]

[tool.uv.extra-build-dependencies]
earth2grid = ["setuptools"]
torch-harmonics = ["setuptools", "torch", "ninja"]

[dependency-groups]
dev = [
    "packaging>=24.1,<25.0.0",
    "pytest>=8.3.2,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
    "pytest-subtests>=0.14.1,<0.15.0",
    "pylint>=3.2.7,<4.0.0",
    "coloredlogs>=15.0.1,<16.0.0",
    "ruff>=0.11.2,<0.12.0",
    "basedpyright>=1.29.5,<2.0.0",
    "iniconfig>=2.0.0,<2.1.0",
    "coverage>=7.9.2,<7.10.0",
    "python-gitlab>=4.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

docs = [
    "nv-dfm-core",
    "myst-nb>=1.2.0",
    "pydata-sphinx-theme>=0.16.1",
    "sphinx-autodoc-typehints>=3.6.3",
    "sphinx-design>=0.7.0",
    "sphinx-favicon>=1.1.0",
    "sphinx-gallery>=0.20.0",
    "sphinx-togglebutton>=0.4.4",
    "sphinx-copybutton>=0.5.2",
    "sphinx>=9.1.0",
]


[tool.ruff]
extend-exclude = ["tutorials/example-fed/examplefed/fed/**", "tutorials/weather_fed/weather_fed/fed/**", "tests/assets/golden/**", "**/_version.py"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["nv_dfm_core", "nv_dfm_lib_common", "nv_dfm_lib_weather", "examplefed", "nv_dfm_lib_all"]

[tool.coverage.paths]
source = [
    "packages/nv-dfm-core/nv_dfm_core",
    "packages/nv-dfm-lib-common/nv_dfm_lib_common",
    "packages/nv-dfm-lib-weather/nv_dfm_lib_weather",
    "tutorials/example-fed"
]

[tool.coverage.report]


[tool.pyright]
ignore = ["ci/**", "tests/assets/**", "**/fed/**", "playground/**", "**/_version.py"]
reportAny = false
reportExplicitAny = false
reportCallInDefaultInitializer = false

# Note: This is a virtual workspace - no build-system needed.
# Individual packages in packages/* have their own build configurations.
