[project]
name = "nv-dfm-lib-weather"
dynamic = ["version"]
description = "Weather data adapters for DFM"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "NVIDIA"}]
requires-python = ">=3.12, <3.13"
# Lightweight core dependencies - no CUDA/torch packages
dependencies = [
    "cartopy>=0.25.0",
    # earth2studio 0.16.0 has two different build-time version strings depending
    # on how it is obtained, so the specifier must accept both:
    #   * workspace/dev: sourced from the git `0.16.0` tag (see root
    #     [tool.uv.sources]); uv's shallow git checkout loses the tag ref, so
    #     setuptools_scm can't `git describe` and falls back to `0.16.0rc0`.
    #   * published wheels: our release pipeline installs the earth2studio sdist
    #     from Artifactory (nv-shared-pypi), which is built from the tag proper and
    #     versions as `0.16.0` (final), also available on public PyPI.
    "earth2studio[data]>=0.16.0rc0,<0.16.1.dev0", ## Data loaders
    "gcsfs>=2025.9.0",
    "herbie-data>=2025.12.0",   ## HRRR ERA5 data
    "intake-esgf>=2025.9.26",   ## CMIP6 data
    "metpy>=1.7.1",             ## HRRR ERA5 data
    "netCDF4>=1.6.4,<1.7.3", # https://github.com/Unidata/netcdf4-python/issues/1438
    "nvidia-physicsnemo>=2.1.0,<3.0.0",
    "nv-dfm-core>=3.1.0,<3.2.0",
    "nv-dfm-lib-common>=3.1.0,<3.2.0",
    "pillow>=13.0.0",  # security: CVE fixes (NSPECT high) first patched in 13.0.0
    "pytz>=2025.2",
    "rioxarray>=0.19.0",
    "zarr>=2.18.3",             ## ECMWF ERA5 data
]

[project.optional-dependencies]
# Cbottle (Climate in a Bottle) model
cbottle = [
    "earth2studio[cbottle]>=0.16.0rc0,<0.16.1.dev0",
]
# Spherical Fourier Neural Operator
sfno = [
    "earth2studio[sfno]>=0.16.0rc0,<0.16.1.dev0",
]
# All optional dependencies
all = [
    "earth2studio[cbottle,sfno]>=0.16.0rc0,<0.16.1.dev0",
]

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

# PyTorch index only needed when installing extras with ML dependencies
# Removed from here to avoid triggering resolution when not needed

[tool.hatch.version]
source = "vcs"
tag-pattern = "nv-dfm-v(?P<version>.*)"
raw-options = { root = "../..", dist_name = "nv-dfm-lib-weather" }

[tool.hatch.build.targets.wheel]
packages = ["nv_dfm_lib_weather"]

[tool.hatch.build.targets.sdist]
packages = ["nv_dfm_lib_weather"]

[dependency-groups]
dev = [
    "scikit-image>=0.25.2",
]
